name: Test und Release

# Jeder Push auf main, der Plugin-Code ändert, wird getestet und als neues Release veröffentlicht.
# Die Version ist das heutige Datum (JJJJ.MM.TT); gibt es sie schon, kommt ein Buchstabe dazu (a, b, c ...).
# Reihenfolge: bauen, Release erstellen, Download prüfen, ERST DANN die .plg ins Repository schreiben.
# So zeigt die .plg im Repository nie auf ein Paket, das es nicht gibt.
# Der Commit mit der aktualisierten vmswitch.plg löst den Workflow nicht erneut aus (paths-Filter).

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'build.sh'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (JJJJ.MM.TT, leer = automatisch)'
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-xml shellcheck libxml2-utils
          npm install --no-save --prefix "$RUNNER_TEMP/jsdom" jsdom
          echo "NODE_PATH=$RUNNER_TEMP/jsdom/node_modules" >> "$GITHUB_ENV"
      - name: Tests ausführen
        run: bash tests/run-tests.sh

  release:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Version bestimmen
        id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            V="$INPUT_VERSION"
          else
            BASE="$(date -u +%Y.%m.%d)"
            for s in "" a b c d e f g h i j k l m n o p q r s t u v w x y z; do
              V="${BASE}${s}"
              git rev-parse -q --verify "refs/tags/${V}" >/dev/null || break
            done
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Paket bauen
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.v.outputs.version }}
        run: bash build.sh "$VERSION"
      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.version }}
          name: ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.event.repository.default_branch }}
          files: |
            dist/*.txz
            dist/*.sha256
      - name: Prüfen, ob das Paket öffentlich herunterladbar ist
        env:
          VERSION: ${{ steps.v.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          URL="https://github.com/${REPO}/releases/download/${VERSION}/vmswitch-${VERSION}-x86_64-1.txz"
          for i in 1 2 3 4 5 6; do
            if curl -fsSL -o /tmp/pkg.txz "$URL"; then
              (cd dist && sha256sum -c ./*.sha256 >/dev/null) && cmp -s /tmp/pkg.txz "dist/vmswitch-${VERSION}-x86_64-1.txz" && { echo "OK: $URL"; exit 0; }
              echo "Heruntergeladene Datei weicht vom gebauten Paket ab" >&2; exit 1
            fi
            echo "Noch nicht erreichbar, Versuch $i von 6 ..."; sleep 10
          done
          echo "Paket nicht erreichbar: $URL (Repository öffentlich? Release veröffentlicht?)" >&2
          exit 1
      - name: Plugin-Datei zurück ins Repository schreiben
        env:
          VERSION: ${{ steps.v.outputs.version }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vmswitch.plg
          git diff --cached --quiet || git commit -m "Release $VERSION"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
